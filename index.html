<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factorial de un número</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Factorial de un número</h1>
    <p>El factorial de un número es el producto de todos los enteros positivos desde 1 hasta ese número. Por ejemplo: 4! = 1 x 2 x 3 x 4 = 24.</p>

    <button id="btnProbar">Probar un número</button>

    <h2>Resultado</h2>
    <p id="resultado">Haz clic en el botón para empezar.</p>

    <h2>Historial</h2>
    <ul id="historial"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
